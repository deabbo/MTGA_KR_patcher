name: Build and Upload Windows Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PySide6 requests

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --icon=app/logo.png --name mtga_KR_patcher_win app/mtga_KR_patcher.py

      - name: Upload EXE to Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mtga_KR_patcher_win.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
