name: Build and Upload Android APK Release

on:
  release:
    types: [published]
  workflow_dispatch: # GitHub UI에서 수동으로 실행 가능

permissions:
  contents: write # Release 페이지에 APK 파일을 업로드하기 위한 권한

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: android

      # (선택 사항) 키스토어가 GitHub Secrets에 등록되어 있을 경우 정식 서명 APK 생성
      # Secrets 목록:
      # - KEYSTORE_BASE64 : jks/keystore 파일을 base64로 인코딩한 문자열
      # - KEYSTORE_PASSWORD : 키스토어 비밀번호
      # - KEY_ALIAS : 키 별칭
      # - KEY_PASSWORD : 키 비밀번호
      - name: Decode Keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
        working-directory: android

      - name: Build Release APK
        run: ./gradlew assembleRelease
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK for Release
        run: |
          # 빌드된 APK 경로 확인 및 정돈된 이름으로 변경
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk mtga_KR_patcher_android.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk mtga_KR_patcher_android.apk
          fi
        working-directory: android

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/mtga_KR_patcher_android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
